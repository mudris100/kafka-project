spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    consumer:
      group-id: delivery-service-group
    bootstrap-servers: localhost:9092

server:
  port: 8082
order-paid-topic: orders.events
delivery-assigned-topic: delivery.events