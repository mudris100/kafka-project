spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    consumer:
      group-id: order-service-group
    bootstrap-servers: localhost:9092

server:
  port: 8080

payment-service:
  base-url: http://localhost:8081

order-paid-topic: orders.events
delivery-assigned-topic: delivery.events